name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CHURCH_NAME: ${{ secrets.VITE_CHURCH_NAME }}
      - run: |
          npx cap add android
          npx cap sync android
      - continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#1c2340' --iconBackgroundColorDark '#1c2340'
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Gabetech-Church.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Gabetech Church Android app
          body: Download Gabetech-Church.apk below and install it on your phone.
          files: Gabetech-Church.apk
          make_latest: true
