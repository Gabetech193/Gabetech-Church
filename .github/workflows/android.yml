name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CHURCH_NAME: ${{ secrets.VITE_CHURCH_NAME }}

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Make app icons from the logo
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#1c2340' --iconBackgroundColorDark '#1c2340'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gabetech-Church.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Gabetech Church Android app
          body: Download Gabetech-Church.apk below and install it on your phone.
          files: Gabetech-Church.apk
          make_latest: true
